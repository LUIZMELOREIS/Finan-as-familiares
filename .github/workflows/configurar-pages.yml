# Diagnostica e tenta destravar a publicação do GitHub Pages sem exigir cliques em Settings.
# Rode manualmente em Actions → "Configurar GitHub Pages" → Run workflow.
#
# Contexto: o job "publicar" de publicar-app.yml é recusado com
# 'Branch "main" is not allowed to deploy to github-pages due to environment protection rules'.
name: Configurar GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Ler configuração do Pages e regras do ambiente
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "== Configuração do Pages =="
          gh api "repos/$REPO/pages" || true
          echo
          echo "== Ambientes =="
          gh api "repos/$REPO/environments" || true
          echo
          echo "== Ambiente github-pages =="
          gh api "repos/$REPO/environments/github-pages" || true
          echo
          echo "== Branches permitidas no ambiente github-pages =="
          gh api "repos/$REPO/environments/github-pages/deployment-branch-policies" || true
          echo
          echo "== Tentativa de apontar o Pages para gh-pages (pode exigir permissão de administrador) =="
          gh api -X PUT "repos/$REPO/pages" \
            -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/' || true

  publicar-sem-ambiente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Construir
        working-directory: app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TOKEN_FAMILIA: ${{ vars.VITE_TOKEN_FAMILIA }}
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_VERSAO: ${{ github.sha }}
        run: npm run build
      - run: touch app/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - name: Publicar no Pages (sem declarar o ambiente)
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Esperar o site responder
        run: |
          URL="${{ steps.deploy.outputs.page_url }}"
          for i in $(seq 1 18); do
            CODIGO=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Tentativa $i: HTTP $CODIGO"
            if [ "$CODIGO" = "200" ]; then echo "Site no ar: $URL"; exit 0; fi
            sleep 10
          done
          exit 1

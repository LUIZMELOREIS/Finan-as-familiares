<form id="authForm" action="api/v1/authorize" method="post">
  <input type="hidden" name="step" id="step" value="2" />
  <input type="hidden" name="response_type" id="response_type" />
  <input type="hidden" name="client_id" id="client_id" />
  <input type="hidden" name="redirect_uri" id="redirect_uri" />
  <input type="hidden" name="scope" id="scope" />
  <input type="hidden" name="state" id="state" />
  <input type="hidden" name="code_challenge" id="code_challenge" />
  <input type="hidden" name="code_challenge_method" id="code_challenge_method" />
  <input type="hidden" name="federacao" id="federacao" />
  <input type="text" name="attribute" id="attribute" placeholder="Usuário (CPF/CNPJ)" maxlength="14" />
  <input type="password" name="password" id="password" placeholder="Senha" />
  <input type="submit" class="button action-button" value="Acessar" />
  <button id="loginButton" class="button-branco">Acessar com passkey</button>
  <button id="GovBRButton" class="button-branco" onclick="javascript:acessarGovBR();">Entrar com gov.br</button>
</form>
